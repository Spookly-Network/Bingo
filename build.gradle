plugins {
    id 'java'
    id("io.freefair.lombok") version "8.6"
    id("io.papermc.paperweight.userdev") version "1.7.1"
    id "com.diffplug.spotless" version "6.20.0"
}

group = 'de.spookly'
version = plugin_version

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "spooklyRepositoryReleases"
        url = "https://mvn.spookly.net/releases"
    }
    maven {
        name = "spooklyRepositorySnapshots"
        url = "https://mvn.spookly.net/snapshots"
    }
}

dependencies {
    //External API's
    compileOnly "org.jetbrains:annotations:${jetbrains_annotations}"
    compileOnly "org.projectlombok:lombok:${lombok_version}"
    annotationProcessor "org.projectlombok:lombok:${lombok_version}"
    compileOnly "org.json:json:${json_version}"
    compileOnly 'org.mongodb:mongodb-driver-reactivestreams:' + project.mongodb_driver_version

    //Internal API's
    compileOnly "de.spookly:SpooklyCoreAPI:${core_version}"
    compileOnly "de.nehlen:SpooklyCloudNetUtils:${cloud_utils_version}"
    compileOnly "de.spookly:canvas:${canvas_version}"

    //Paper / NMS
    paperweight.paperDevBundle(project.paper_version)
}

spotless {
    java {
        removeUnusedImports()
        importOrder('java', 'javax', '', 'de.spookly', 'net.minecraft', 'org.bukkit')
        indentWithTabs()
        trimTrailingWhitespace()
    }
}

processResources {
    def props = [version: version, mongodb_driver_version: mongodb_driver_version, json_version: json_version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

jar {
    archiveFileName = "SpooklyBingo-${version}.jar"
    manifest {
        attributes["paperweight-mappings-namespace"] = "mojang"
    }
}

build {
    dependsOn spotlessApply;
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}